name: Build, scan and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap_publish:
        description: Temporary bootstrap only publish the image even when Trivy finds vulnerabilities
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}

      - name: Scan image for blocking vulnerabilities
        if: inputs.bootstrap_publish != true
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Bootstrap scan report (non-blocking, temporary)
        if: inputs.bootstrap_publish == true
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push scanned image
        if: github.event_name != 'pull_request'
        run: docker push "${{ env.IMAGE }}"

      - name: Update GitOps image reference
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          sed -i -E "s|^[[:space:]]*image: .*|          image: ${IMAGE}|" k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --cached --quiet || git commit -m "chore: deploy ${GITHUB_SHA} [skip ci]"
          git push

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}
          artifact-name: sbom-${{ github.sha }}.spdx.json
          output-file: sbom-${{ github.sha }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom-${{ github.sha }}.spdx.json
