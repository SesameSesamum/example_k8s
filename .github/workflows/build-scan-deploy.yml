name: Build, scan and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_scan:
        description: Skip Trivy scan to force the image into the GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write   # required for keyless cosign signing/attaching

env:
  IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
                ghcr.io/${{ github.repository }}:latest

      # Scan image using Trivy, report on vulnerabilities, block if CRITICAL or HIGH vulnerabilities are found
      - name: Scan image for blocking vulnerabilities
        if: inputs.skip_scan != true
        id: trivy-blocking
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: json
          output: trivy-results.json
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Report and enforce vulnerability threshold
        if: inputs.skip_scan != true
        shell: bash
        run: |
          if [ ! -f trivy-results.json ]; then
            echo "::error::Trivy did not produce a results file. The scan could not be evaluated."
            exit 1
          fi

          critical_count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)
          high_count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json)
          echo "Trivy results: ${critical_count} CRITICAL, ${high_count} HIGH vulnerabilities."

          if [ "$critical_count" -gt 0 ] || [ "$high_count" -gt 0 ]; then
            echo "::error::Trivy blocked publication: ${critical_count} CRITICAL and ${high_count} HIGH vulnerabilities discovered."
            exit 1
          fi

          echo "Trivy security gate passed: no HIGH or CRITICAL vulnerabilities discovered."

      - name: Bootstrap scan report
        if: inputs.skip_scan == true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # Push image to GHCR ONLY if not a pull request
      - name: Push scanned image
        if: github.event_name != 'pull_request'
        run: docker push "${{ env.IMAGE }}"

      # Updates the image reference in the GitOps deployment manifest and commits the change to the main branch
      - name: Update GitOps image reference
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          sed -i -E "s|^[[:space:]]*image: .*|          image: ${IMAGE}|" k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --cached --quiet || git commit -m "chore: deploy ${GITHUB_SHA} [skip ci]"
          git push

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}
          artifact-name: sbom-${{ github.sha }}.spdx.json
          output-file: sbom-${{ github.sha }}.spdx.json

      - name: Attach SBOM to image in GHCR
        if: github.event_name != 'pull_request'
        run: |
          cosign attach sbom --sbom sbom-${{ github.sha }}.spdx.json "${{ env.IMAGE }}"