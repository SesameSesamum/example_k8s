apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-world-vulnerability-scan
  namespace: hello-world
  labels:
    app.kubernetes.io/name: hello-world-vulnerability-scan
spec:
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hello-world-vulnerability-scan
        spec:
          restartPolicy: Never
          serviceAccountName: hello-world
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            fsGroup: 1000
          initContainers:
            - name: trivy-scan
              image: aquasec/trivy:0.58.1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - >-
                  trivy image
                  --severity HIGH,CRITICAL
                  --ignore-unfixed=false
                  --format json
                  --output /shared/trivy-results.json
                  --exit-code 1
                  --no-progress
                  "${IMAGE}";
                  echo $? > /shared/exit-code
              env:
                - name: IMAGE
                  valueFrom:
                    configMapKeyRef:
                      name: scan-config
                      key: image
                - name: TRIVY_CACHE_DIR
                  value: /tmp/trivy-cache
                - name: TMPDIR
                  value: /tmp/trivy-cache
                # imagePullSecrets on the ServiceAccount only cover kubelet pulls, not Trivy's own registry calls
                - name: TRIVY_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: ghcr-scan-credentials
                      key: username
                      optional: true
                - name: TRIVY_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ghcr-scan-credentials
                      key: password
                      optional: true
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: trivy-cache
                  mountPath: /tmp/trivy-cache
                - name: shared
                  mountPath: /shared
          containers:
            - name: notify
              image: curlimages/curl:8.11.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - >-
                  critical=$(grep -c '"Severity": "CRITICAL"' /shared/trivy-results.json || true);
                  high=$(grep -c '"Severity": "HIGH"' /shared/trivy-results.json || true);
                  if [ "$critical" -gt 0 ] || [ "$high" -gt 0 ]; then
                  curl -fsS -H "Title: hello-world scan found vulnerabilities" -H "Priority: high"
                  -d "Image: ${IMAGE} CRITICAL: ${critical} HIGH: ${high}" "${NTFY_URL}";
                  fi;
                  exit $(cat /shared/exit-code)
              env:
                - name: IMAGE
                  valueFrom:
                    configMapKeyRef:
                      name: scan-config
                      key: image
                - name: NTFY_URL
                  valueFrom:
                    configMapKeyRef:
                      name: scan-config
                      key: ntfy-url
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: shared
                  mountPath: /shared
          volumes:
            - name: trivy-cache
              emptyDir: {}
            - name: shared
              emptyDir: {}
