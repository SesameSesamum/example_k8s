<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello from Kubernetes</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { display: grid; min-height: 100vh; place-items: center; margin: 0; background: #102a43; color: #f0f4f8; }
    main { max-width: 38rem; padding: 3rem; text-align: center; }
    h1 { margin: 0 0 1rem; font-size: clamp(2rem, 8vw, 4rem); }
    p { color: #bcccdc; font-size: 1.15rem; }
    code { color: #7fe3b1; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, Kubernetes.</h1>
    <p>This page is served by a non-root nginx container. This is post edit for testing.</p>
    <p><code>hello-world</code> is running successfully.</p>
  </main>
</body>
</html>
